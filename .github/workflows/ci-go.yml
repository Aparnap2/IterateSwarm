# .github/workflows/ci-go.yml
# Go API gateway tests — webhook handlers, gRPC bridge, health checks

name: Go Gateway Tests

on:
  push:
    paths:
      - "apps/core/**"
      - "apps/gateway/**"
  pull_request:
    paths:
      - "apps/core/**"
      - "apps/gateway/**"

jobs:
  go-tests:
    name: Go Gateway (Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Webhook tests (razorpay_test.go, telegram_test.go) expect
    # postgres://postgres:postgres@localhost:5432/iterateswarm_test (see setupTestDB).
    # Without this service they SKIP and total coverage falls below the 60% gate.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iterateswarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iterateswarm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run Go unit tests
        working-directory: apps/core
        env:
          TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/iterateswarm_test?sslmode=disable"
        run: |
          go test ./... \
            -v \
            -count=1 \
            -timeout 60s \
            -coverprofile=coverage.out

      - name: Check coverage threshold
        working-directory: apps/core
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "FAIL: Go coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

      - name: Run go vet
        working-directory: apps/core
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2024.1"
          working-directory: apps/core
